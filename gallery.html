<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Carmel Girls' Secondary School, Arusha</title>
  <meta name="description" content="Photos of sports, student life, faith and events at Carmel Girls' Secondary School, Olasiti, Arusha.">
  <meta name="theme-color" content="#6b1d2a">
  <link rel="icon" href="images/logo-64.png" type="image/png">
  <link rel="apple-touch-icon" href="images/logo-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="page-banner">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Gallery</div>
      <h1>Gallery</h1>
      <p>Moments from the classroom, the court, the chapel and beyond.</p>
    </div>
    <svg class="hero__mountain" viewBox="0 0 1440 220" preserveAspectRatio="none" aria-hidden="true"><path fill="rgba(255,255,255,.07)" d="M0 220V150l240-30 240-60 140-40 80 20 120 50 220 20 220-30 180 40v100z"/><path fill="#faf6ef" d="M0 220v-30q360-40 720-15t720-5v50z"/></svg>
  </section>

  <section class="section">
    <div class="container">
      <div class="filters">
        <button class="tab-btn active" data-filter="all">All</button>
        <button class="tab-btn" data-filter="sports">Sports</button>
        <button class="tab-btn" data-filter="life">Student Life</button>
        <button class="tab-btn" data-filter="events">Faith &amp; Events</button>
      </div>
      <!-- To add a photo: copy it into images/photos/ and duplicate one of the buttons below. -->
      <div class="gallery">
        <button class="gallery__item" data-cat="sports" data-caption="Netball champions lift their trophy"><div class="photo"><img src="images/photos/netball-trophy-celebration.jpg" alt="Netball team lifting a trophy with their teachers" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="sports" data-caption="Netball match in front of the school building"><div class="photo"><img src="images/photos/netball-match.jpg" alt="Netball match with students watching from the balcony" loading="lazy" style="object-position:center 60%"></div></button>
        <button class="gallery__item" data-cat="events" data-caption="Students singing in the chapel"><div class="photo"><img src="images/photos/choir-chapel.jpg" alt="Students singing in the chapel" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="life" data-caption="Teamwork during the maize harvest"><div class="photo"><img src="images/photos/campus-maize-harvest.jpg" alt="Students shelling maize on the school grounds" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="sports" data-caption="The netball team with their trophy and teachers"><div class="photo"><img src="images/photos/netball-trophy-team.jpg" alt="Netball team posing with their trophy and teachers" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="events" data-caption="Tree planting with the Sisters of Apostolic Carmel"><div class="photo"><img src="images/photos/tree-planting.jpg" alt="Tree planting ceremony with the Sisters and students" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="sports" data-caption="Players and supporters celebrate together"><div class="photo"><img src="images/photos/netball-squad-supporters.jpg" alt="Netball players and supporters with a teacher" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="life" data-caption="Students in class"><div class="photo"><img src="images/photos/students-in-class.jpg" alt="Students in class" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="sports" data-caption="The netball team by the pool"><div class="photo"><img src="images/photos/netball-team-poolside.jpg" alt="Netball team posing beside a swimming pool" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="events" data-caption="Students listen to a guest speaker"><div class="photo"><img src="images/photos/guest-speaker.jpg" alt="Students listening to a speaker in the school hall" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="life" data-caption="Shelling maize together"><div class="photo"><img src="images/photos/maize-shelling-closeup.jpg" alt="Students shelling maize together" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="life" data-caption="Relaxing after an afternoon of activities"><div class="photo"><img src="images/photos/students-relaxing.jpg" alt="Students relaxing together with a teacher" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="sports" data-caption="Celebrating the trophy win"><div class="photo"><img src="images/photos/netball-trophy-celebration-2.jpg" alt="Netball team raising a trophy" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="life" data-caption="Working together on the lawn"><div class="photo"><img src="images/photos/maize-shelling-garden.jpg" alt="Students shelling maize on the lawn" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="sports" data-caption="Proud champions"><div class="photo"><img src="images/photos/netball-trophy-team-2.jpg" alt="Netball team with their trophy" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="sports" data-caption="Team spirit"><div class="photo"><img src="images/photos/netball-squad-supporters-2.jpg" alt="Netball players and supporters" loading="lazy"></div></button>
        <button class="gallery__item" data-cat="sports" data-caption="The champions with their coaches"><div class="photo"><img src="images/photos/netball-trophy-team-3.jpg" alt="Netball team with coaches and trophy" loading="lazy"></div></button>
      </div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lightbox__close" aria-label="Close">×</button>
  <div class="lightbox__content"><div class="lightbox__media"></div><p class="lightbox__caption"></p></div>
</div>

<div id="site-footer"></div>
<script src="js/main.js"></script>
</body>
</html>
